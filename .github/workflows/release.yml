name: Release

# 打 v* 标签（如 v0.1.0）即自动构建并发布 docref 的可下载包。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: dotnet publish src/Docref/Docref.csproj -c Release -r win-x64 --self-contained false -o publish/win-x64

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/win-x64/* -DestinationPath docref-win-x64.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: docref-win-x64.zip
          generate_release_notes: true
